<div class="page stack">
  <header class="stack" style="gap: var(--space-2)">
    <h1>Nexo</h1>
    <p style="color: var(--color-ink-soft)">Sistema de gestión de arrendamientos y pagos.</p>
  </header>

  <section class="card stack">
    <h2>Nuevo contrato</h2>
    <nexo-text-field label="Inquilino" placeholder="Nombre completo" [(ngModel)]="tenantName" />
    <nexo-select-field label="Tipo de propiedad" [options]="propertyTypes" [(ngModel)]="propertyType" />
    <div class="cluster">
      <nexo-button variant="primary">Guardar contrato</nexo-button>
      <nexo-button variant="secondary">Guardar como borrador</nexo-button>
      <nexo-button variant="ghost">Cancelar</nexo-button>
    </div>
  </section>

  <section class="card stack">
    <h2>Estados de contrato</h2>
    <div class="cluster">
      @for (status of allStatuses; track status) {
        <nexo-status-badge [status]="status" />
      }
    </div>
  </section>
</div>
