<div class="field">
  @if (label()) {
    <span class="field__label">{{ label() }}</span>
  }

  <button
    type="button"
    class="field__control listbox__trigger"
    [class.listbox__trigger--open]="open()"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="handleKeydown($event)"
  >
    <span [class.listbox__placeholder]="!selectedLabel">{{ selectedLabel ?? placeholder() }}</span>
    <svg class="listbox__chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M5 7.5 10 12.5 15 7.5" />
    </svg>
  </button>

  @if (open()) {
    <ul class="listbox__panel" role="listbox">
      @for (option of options(); track option.value; let i = $index) {
        <li
          role="option"
          class="listbox__option"
          [class.listbox__option--active]="i === activeIndex()"
          [class.listbox__option--selected]="option.value === value()"
          [attr.aria-selected]="option.value === value()"
          (mouseenter)="activeIndex.set(i)"
          (click)="select(option)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
